[package]
edition = "2024"

name = "rubadan"
version = "0.1.1"
description = "A GUI import tool for hledger (a plain text accounting tool), usable on the web and on desktop."
authors = [ "Kerstin Humm <kerstin@erictapen.name>" ]
license = "GPL-3.0-or-later"
repository = "https://github.com/erictapen/rubadan"

[features]
default = []
demo = []


[dependencies]
egui = { version = "0.36", default-features = false }
epaint = { version = "0.36", default-features = false }
egui_extras = { version = "0.36", default-features = false }
emath = { version = "0.36", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rfd = "0.17"
mt940 = "1.1"
rust_decimal = "1.43"
iban = "0.2"
strum = "0.27"
strum_macros = "0.27"
chrono = "0.4"
indexmap = "2.14"
nom = "8"


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
eframe = { version = "0.36", default-features = false, features = [ "persistence", "wayland", "glow", "x11" ] }
futures = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "=0.2.126" }
wasm-bindgen-futures = { version = "0.4", default-features = false }
web-sys = { version = "0.3", default-features = false }
eframe = { version = "0.36", default-features = false, features = [ "persistence", "glow" ] }

[profile.release]
opt-level = 2
