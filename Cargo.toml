[package]
name = "implementation"
version = "0.1.0"
edition = "2024"


[dependencies]
egui = { version = "*", default-features = false, git = "https://github.com/valadaptive/egui", branch = "parley-2" }
epaint = { version = "*", default-features = false, git = "https://github.com/valadaptive/egui", branch = "parley-2" }
egui_extras = { version = "*", default-features = false, git = "https://github.com/valadaptive/egui", branch = "parley-2" }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
log = "*"
rfd = "*"
mt940 = "*"
rust_decimal = "*"
iban = "*"


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "*"
eframe = { version = "*", default-features = false, features = [ "wayland", "glow", "x11" ], git = "https://github.com/valadaptive/egui", branch = "parley-2" }
futures = "*"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "*", default-features = false }
web-sys = { version = "*", default-features = false }
eframe = { version = "*", default-features = false, features = [ "glow" ], git = "https://github.com/valadaptive/egui", branch = "parley-2" }

[profile.release]
opt-level = 2

